<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PHOENIX - Voxel Racer</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:#1a0f00;font-family:'Courier New',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;color:#fff;overflow:hidden}
  h1{margin:6px 0 2px;font-size:18px;letter-spacing:3px;color:#ffe600;text-shadow:2px 2px 0 #c00}
  p{margin:0 0 6px;font-size:11px;opacity:.8}
  #wrap{position:relative;width:min(96vw,720px);aspect-ratio:4/3;background:#000;border:4px solid #222;box-shadow:0 0 0 2px #ffe600,0 10px 40px rgba(0,0,0,.8);overflow:hidden}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;background:#c98a3a}
  #hud{position:absolute;left:0;right:0;bottom:0;display:flex;gap:4px;padding:4px;background:rgba(0,0,0,.65)}
  .box{flex:1;background:#111;border:2px solid #fff;padding:4px 6px;text-align:center;font-size:11px;line-height:1.2}
  .box b{font-size:14px}
  .red{background:#c00}.blue{background:#22c}.yellow{background:#e6b800;color:#000}
  #topHud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:6px 8px;font-size:12px;font-weight:bold;text-shadow:1px 1px 0 #000;pointer-events:none}
  #msg{position:absolute;top:38%;left:50%;transform:translate(-50%,-50%);background:#000;border:3px solid #ffe600;padding:12px 18px;text-align:center;display:none;z-index:5}
  #msg h2{margin:0;color:#ffe600;font-size:20px}
  #msg button{margin-top:8px;padding:8px 16px;background:#ffe600;border:none;font-weight:bold;cursor:pointer;font-family:inherit}
  #controls{position:absolute;bottom:52px;left:0;right:0;display:none;justify-content:space-between;padding:0 8px;pointer-events:none}
  .pad{display:flex;gap:6px;pointer-events:auto}
  .btn{width:48px;height:48px;background:rgba(255,255,255,.9);color:#000;border:3px solid #000;border-radius:8px;font-size:20px;font-weight:bold;display:flex;align-items:center;justify-content:center;user-select:none;touch-action:none}
  .btn.turbo{background:#ff2a00;color:#fff;width:64px}
  @media (max-width:700px){ #controls{display:flex} }
</style>
</head>
<body>
<h1>★ PHOENIX VOXEL GP ★</h1>
<p>ARROWS / WASD to drive • SPACE = TURBO • 3 LAPS • Don't run out of fuel!</p>
<div id="wrap">
  <canvas id="game" width="480" height="360"></canvas>
  <div id="topHud"><span id="lap">LAP 1/3</span><span id="time">TIME 0:00.0</span><span id="pos">POS 1/4</span></div>
  <div id="msg"><h2 id="msgTitle">READY?</h2><div id="msgSub">Press ENTER to Start</div><button onclick="startGame()">START RACE</button></div>
  <div id="controls">
    <div class="pad"><div class="btn" id="leftBtn">◀</div><div class="btn" id="rightBtn">▶</div></div>
    <div class="pad"><div class="btn turbo" id="turboBtn">TURBO</div><div class="btn" id="upBtn">▲</div><div class="btn" id="downBtn">▼</div></div>
  </div>
  <div id="hud">
    <div class="box red">CAR<br><b id="carStat">OK</b></div>
    <div class="box">FUEL<br><b id="fuelStat">100%</b><br><div style="height:6px;background:#333;margin-top:2px"><div id="fuelBar" style="height:100%;width:100%;background:#0f0"></div></div></div>
    <div class="box yellow">TURBO<br><b id="speedStat">0</b> KM/H</div>
    <div class="box blue">INSERT COIN<br><b>TO PLAY</b></div>
  </div>
</div>

<script>
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
let W=480,H=360;
let keys={}, started=false, gameOver=false, lap=1, startTime=0, elapsed=0, lastLapTime=0, checkpoints=[false,false,false,false];
let fuel=100, turbo=100, speed=0, angle=-Math.PI/2, pos={x:240,y:295};
let cam={x:0,y:0};
let opponents=[];
let particles=[];

// Phoenix oval - center, radii
const CX=240, CY=180, RX=185, RY=105, TRACK_W=34;

function isOnTrack(x,y){
  let dx=(x-CX)/RX, dy=(y-CY)/RY;
  let d=Math.sqrt(dx*dx+dy*dy);
  let inner=(RX-TRACK_W)/RX, outer=(RX+2)/RX;
  // approximate oval distance
  let dist=Math.abs(d-1)*RX;
  return dist < TRACK_W/2;
}
function trackAngle(x,y){ return Math.atan2((y-CY)/RY,(x-CX)/RX); }

function reset(){
  pos={x:240,y:295}; angle=-Math.PI/2; speed=0; lap=1; fuel=100; turbo=100;
  opponents=[];
  for(let i=0;i<3;i++){
    opponents.push({x:240+(i-1)*18, y:310+i*12, angle:-Math.PI/2, speed:0, color:['#00e5ff','#ff00aa','#7CFC00'][i], lap:1, prog:0, offset:(i-1)*0.15});
  }
  checkpoints=[false,false,false,false];
  started=true; gameOver=false; startTime=performance.now();
  document.getElementById('msg').style.display='none';
}
function startGame(){ reset(); }

function drawVoxelCube(x,y,s,c1,c2){
  ctx.fillStyle=c1; ctx.fillRect(x-s/2,y-s/2,s,s);
  ctx.fillStyle=c2; ctx.fillRect(x-s/2,y-s/2,s,s*0.35);
  ctx.fillStyle='rgba(0,0,0,0.25)'; ctx.fillRect(x-s/2,y-s/2+s*0.7,s,s*0.3);
  ctx.fillStyle='rgba(255,255,255,0.35)'; ctx.fillRect(x-s/2,y-s/2,2,s);
}

// Background - desert voxel grid
function drawWorld(){
  // desert
  ctx.fillStyle='#d19a4a'; ctx.fillRect(0,0,W,H);
  // voxel ground tiles
  for(let gy=0; gy<18; gy++) for(let gx=0; gx<24; gx++){
    if((gx+gy)%5===0){ ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fillRect(gx*20,gy*20,20,20); }
    if((gx*3+gy*7)%17===0){ ctx.fillStyle='#b57f2f'; ctx.fillRect(gx*20+8,gy*20+8,4,4); }
  }
  // infield grass - green voxel patch like screenshot
  ctx.fillStyle='#2f9e44'; ctx.fillRect(150,115,180,130);
  ctx.fillStyle='#35b84e';
  for(let i=0;i<40;i++){ ctx.fillRect(155+Math.random()*170,120+Math.random()*120,6,3); }
  // infield buildings - PHOENIX sign
  ctx.fillStyle='#fff'; ctx.fillRect(185,145,110,28);
  ctx.fillStyle='#0044ff'; ctx.fillRect(185,145,110,28);
  ctx.fillStyle='#fff'; ctx.font='bold 13px monospace'; ctx.textAlign='center'; ctx.fillText('PHOENIX',240,164);
  ctx.fillStyle='#eee'; ctx.fillRect(200,180,18,12); ctx.fillRect(230,180,18,12); ctx.fillRect(260,180,18,12);
  // grandstands - top and bottom voxel blocks
  for(let i=0;i<16;i++){
    let x=70+i*22;
    ctx.fillStyle=i%2?'#ff6b00':'#ffe600'; ctx.fillRect(x,18,18,14);
    ctx.fillStyle='#222'; ctx.fillRect(x,18,18,3);
    ctx.fillStyle=i%2?'#00aaff':'#ff0066'; ctx.fillRect(x,328,18,14);
  }
  // trees as voxel cubes
  [[60,90],[420,90],[60,270],[420,270],[120,60],[360,60]].forEach(([x,y])=>{
    ctx.fillStyle='#8b5a2b'; ctx.fillRect(x-3,y,6,10);
    drawVoxelCube(x,y-8,16,'#1e7a2e','#2fae3e');
  });
  // Track - asphalt oval with pixel edge
  ctx.strokeStyle='#333'; ctx.lineWidth=TRACK_W+6; ctx.beginPath(); ctx.ellipse(CX,CY,RX,RY,0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.setLineDash([8,6]); ctx.beginPath(); ctx.ellipse(CX,CY,RX,RY,0,0,Math.PI*2); ctx.stroke(); ctx.setLineDash([]);
  ctx.strokeStyle='#4a4a4a'; ctx.lineWidth=TRACK_W; ctx.beginPath(); ctx.ellipse(CX,CY,RX,RY,0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#ffe600'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(CX,CY,RX-TRACK_W/2,RY-TRACK_W/2,0,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#ffe600'; ctx.beginPath(); ctx.ellipse(CX,CY,RX+TRACK_W/2,RY+TRACK_W/2,0,0,Math.PI*2); ctx.stroke();
  // start/finish line - checkered
  for(let i=0;i<6;i++) for(let j=0;j<2;j++){ ctx.fillStyle=(i+j)%2?'#000':'#fff'; ctx.fillRect(232+i*3, 282+j*4, 3,4); }
  // start gantry
  ctx.fillStyle='#ff2222'; ctx.fillRect(228,275,24,5);
  ctx.fillStyle='#111'; ctx.fillRect(240,240,6,40); ctx.font='bold 8px monospace'; ctx.fillStyle='#fff'; ctx.fillText('START',228,272);
  // score tower like screenshot
  ctx.fillStyle='#222'; ctx.fillRect(232,72,16,68);
  ctx.fillStyle='#ffe600'; ctx.font='bold 9px monospace'; ctx.fillText('3',240,84); ctx.fillText('3',240,96); ctx.fillText('2',240,108); ctx.fillText('2',240,120); ctx.fillText('1',240,132);
}

function drawCar(x,y,a,color,isPlayer){
  ctx.save(); ctx.translate(x,y); ctx.rotate(a+Math.PI/2);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(-9, -10, 18, 24);
  // voxel body - stacked blocks
  ctx.fillStyle=color; ctx.fillRect(-8,-12,16,22);
  ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.fillRect(-8,-12,16,5);
  ctx.fillStyle='#111'; ctx.fillRect(-4,-4,8,8); // cockpit
  ctx.fillStyle='#fff'; ctx.fillRect(-2,-8,4,4); // driver helmet
  ctx.fillStyle='#000'; ctx.fillRect(-10,-8,3,5); ctx.fillRect(7,-8,3,5); ctx.fillRect(-10,6,3,5); ctx.fillRect(7,6,3,5);
  if(isPlayer){ ctx.fillStyle='#ffe600'; ctx.fillRect(-8,-14,16,2); }
  ctx.restore();
  // voxel exhaust particles
  if(Math.random()<0.3 && speed>2){ particles.push({x:x-Math.cos(a)*10,y:y-Math.sin(a)*10,life:12}); }
}

function update(dt){
  if(!started||gameOver) return;
  elapsed=(performance.now()-startTime)/1000;
  let accel=0, turn=0;
  if(keys['ArrowUp']||keys['w']||keys['W']) accel=1;
  if(keys['ArrowDown']||keys['s']||keys['S']) accel=-0.6;
  if(keys['ArrowLeft']||keys['a']||keys['A']) turn=-1;
  if(keys['ArrowRight']||keys['d']||keys['D']) turn=1;
  let boosting=(keys[' ']||keys['Shift']) && turbo>0;
  let maxSpeed = boosting? 5.2 : 3.4;
  let onTrack=isOnTrack(pos.x,pos.y);
  if(!onTrack) maxSpeed=1.4;
  if(accel>0) speed=Math.min(maxSpeed, speed+0.08*accel*(boosting?1.6:1));
  else if(accel<0) speed=Math.max(-1.2, speed+0.06*accel);
  else speed*=0.985;
  if(boosting){ turbo=Math.max(0,turbo-0.35); fuel=Math.max(0,fuel-0.02); }
  else turbo=Math.min(100,turbo+0.08);
  if(speed>0.1) fuel=Math.max(0,fuel-0.008);
  angle += turn * 0.045 * (speed/3) * (speed>=0?1:-1);
  pos.x+=Math.cos(angle)*speed; pos.y+=Math.sin(angle)*speed;
  // walls
  if(pos.x<18) pos.x=18; if(pos.x>W-18) pos.x=W-18; if(pos.y<18) pos.y=18; if(pos.y>H-18) pos.y=H-18;
  // checkpoints + lap
  let a=trackAngle(pos.x,pos.y);
  // start line at bottom: angle ~ PI/2
  if(a>0 && a<0.6) checkpoints[0]=true;
  if(a>1.2 && a<1.9) checkpoints[1]=true;
  if(a>2.5 || a<-2.5) checkpoints[2]=true;
  if(a>-1.9 && a<-1.2) checkpoints[3]=true;
  // lap when crossing start going right->left? Use bottom crossing
  if(pos.y>290 && pos.y<305 && pos.x>235 && pos.x<250 && Math.cos(angle)>0.5){
    if(checkpoints.every(Boolean)){
      lap++; checkpoints=[false,false,false,false];
      if(lap>3){ gameOver=true; showMsg('🏆 YOU WIN!','Time '+elapsed.toFixed(1)+'s • Press START to race again'); }
    }
  }
  if(fuel<=0){ gameOver=true; showMsg('⛽ OUT OF FUEL','Press START to try again'); }

  // simple AI opponents follow oval
  opponents.forEach(o=>{
    o.prog+=0.0035+Math.random()*0.001;
    let targetAngle=o.prog*Math.PI*2 - Math.PI/2 + o.offset*0.2;
    let tx=CX+Math.cos(targetAngle)*RX, ty=CY+Math.sin(targetAngle)*RY;
    let desired=Math.atan2(ty-o.y, tx-o.x);
    let diff=((desired-o.angle+Math.PI*3)%(Math.PI*2))-Math.PI;
    o.angle+=diff*0.08;
    o.x+=Math.cos(o.angle)*2.6; o.y+=Math.sin(o.angle)*2.6;
  });

  // position
  let myProg = (Math.atan2((pos.y-CY)/RY,(pos.x-CX)/RX)+Math.PI*2)%(Math.PI*2) + (lap-1)*Math.PI*2;
  let all=[myProg, ...opponents.map(o=> (Math.atan2((o.y-CY)/RY,(o.x-CX)/RX)+Math.PI*2)%(Math.PI*2)+(o.lap-1)*Math.PI*2)];
  let rank=1+all.filter(v=>v>myProg).length;
  document.getElementById('lap').textContent=`LAP ${Math.min(lap,3)}/3`;
  document.getElementById('pos').textContent=`POS ${rank}/4`;
  document.getElementById('time').textContent=`TIME ${Math.floor(elapsed/60)}:${(elapsed%60).toFixed(1).padStart(4,'0')}`;
  document.getElementById('fuelStat').textContent=Math.floor(fuel)+'%';
  document.getElementById('fuelBar').style.width=fuel+'%';
  document.getElementById('fuelBar').style.background=fuel>40?'#0f0':fuel>15?'#ff0':'#f00';
  document.getElementById('speedStat').textContent=Math.floor(Math.abs(speed)*42);
  document.getElementById('carStat').textContent=onTrack?'OK':'DIRT!';
}

function showMsg(t,s){
  document.getElementById('msgTitle').textContent=t;
  document.getElementById('msgSub').textContent=s;
  document.getElementById('msg').style.display='block';
}

function loop(){
  drawWorld();
  // particles
  particles=particles.filter(p=>p.life-->0);
  particles.forEach(p=>{ ctx.fillStyle='rgba(255,255,255,0.7)'; ctx.fillRect(p.x,p.y,3,3); });
  opponents.forEach(o=>drawCar(o.x,o.y,o.angle,o.color,false));
  if(started) drawCar(pos.x,pos.y,angle,'#ff2222',true);
  else drawCar(240,295,-Math.PI/2,'#ff2222',true);
  update(16);
  requestAnimationFrame(loop);
}
loop();
document.getElementById('msg').style.display='block';

addEventListener('keydown',e=>{
  keys[e.key]=true;
  if(e.key==='Enter' && !started) startGame();
  if(e.key==='Enter' && gameOver) startGame();
  if(e.key===' ') e.preventDefault();
});
addEventListener('keyup',e=>keys[e.key]=false);

// touch
function bind(id,key){
  let el=document.getElementById(id);
  let on=e=>{e.preventDefault(); keys[key]=true;};
  let off=e=>{e.preventDefault(); keys[key]=false;};
  el.addEventListener('touchstart',on); el.addEventListener('touchend',off);
  el.addEventListener('mousedown',on); el.addEventListener('mouseup',off);
}
bind('leftBtn','ArrowLeft'); bind('rightBtn','ArrowRight'); bind('upBtn','ArrowUp'); bind('downBtn','ArrowDown'); bind('turboBtn',' ');
</script>
</body>
</html>
